<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>みんなの日本語｜第一、二課練習</title><style>
:root{--bg:#f5f7fb;--ink:#1b2738;--muted:#69798c;--blue:#285fba;--line:#dce4ef;--green:#15784b;--red:#b93a4a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.6 system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink)}main{max-width:850px;margin:auto;padding:22px 16px 60px}.hero{padding:22px 25px;background:#173f7a;color:white;border-radius:22px;margin-bottom:16px}.hero h1{margin:0;font-size:1.65rem}.hero p{margin:4px 0 0;color:#d9e9ff}.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:15px;box-shadow:0 6px 22px #1a3c6510}h2{font-size:1.1rem;margin:0 0 12px}.sub{font-size:.88rem;color:var(--muted)}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.check{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--line);border-radius:11px;cursor:pointer}.check input{accent-color:var(--blue);width:17px;height:17px}.settings{display:flex;gap:12px;flex-wrap:wrap;margin:13px 0}.settings label{display:flex;gap:6px;align-items:center}.settings select,.settings input{font:inherit;border:1px solid var(--line);border-radius:9px;padding:8px;background:white;max-width:145px}.btn{cursor:pointer;border:0;border-radius:11px;padding:11px 16px;background:var(--blue);color:white;font:inherit;font-weight:650}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.alt{background:#eaf1fa;color:#173f7a}.btn.outline{background:white;border:1px solid var(--line);color:var(--ink)}.buttons{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.progress{height:8px;background:#e8eef5;border-radius:8px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:var(--blue);width:0%;transition:width .2s}.question{font-size:2.0rem;font-weight:750;line-height:1.4;margin:17px 0 9px}.prompt{color:var(--muted);font-weight:600}.answer{font:inherit;width:100%;border-radius:13px;border:2px solid var(--line);padding:14px 15px;font-size:1.2rem;outline:none}.answer:focus{border-color:#4c80ca}.feedback{border-radius:13px;padding:16px;margin-top:12px;background:#f1f5fb;border:1px solid var(--line)}.feedback.good{background:#edf9f2;border-color:#a9dec1}.feedback.bad{background:#fff1f1;border-color:#f1c3c8}.feedback strong{font-size:1.08rem}.jp{font-size:1.22rem;font-weight:700}.small{font-size:.89rem;color:var(--muted)}.hidden{display:none!important}.stat{display:flex;gap:20px;flex-wrap:wrap;font-size:.92rem;color:var(--muted)}.stat strong{color:var(--ink)}.chip{display:inline-block;border-radius:100px;background:#eef3fb;padding:3px 10px;font-size:.8rem;color:#315887;margin:3px 5px 3px 0}.note{background:#fff8e9;border-left:4px solid #dfa936;padding:10px 13px;border-radius:6px;font-size:.9rem}.help{font-size:.9rem;color:var(--muted)}@media(max-width:500px){.question{font-size:1.65rem}.panel{padding:16px}.hero{padding:18px}}
</style></head><body><main><header class="hero"><h1>日本語練習室 <span style="font-size:1rem">🇯🇵</span></h1><p>第一・二課｜中文翻譯・假名漢字・聽音辨識</p></header><section class="panel" id="setup"><h2>① 選擇考試範圍</h2><div class="groups" id="groups"></div><div class="buttons"><button class="btn alt" id="all">全選</button><button class="btn alt" id="none">取消全選</button></div><h2 style="margin-top:22px">② 測驗設定</h2><div class="settings"><label>題型 <select id="mode"><option value="zh">中文 → 日文</option><option value="kanji">假名 → 漢字／中文</option><option value="listen">聽發音 → 日文</option><option value="mixed">三種混合</option></select></label><label>題數 <select id="count"><option value="10">10 題</option><option value="20">20 題</option><option value="all">全部題目</option></select></label><label><input type="checkbox" id="random" checked>隨機出題</label></div><p class="help">支援平假名、片假名及正確漢字；立即顯示答案、讀音、日文漢字及易錯提醒。音訊使用裝置內建日文語音，效果依瀏覽器而異。</p><button id="start" class="btn">開始測驗 →</button><p id="error" class="small" style="color:var(--red)"></p></section><section id="quiz" class="panel hidden"><div class="stat"><span id="step"></span><span id="score"></span><span id="scope"></span></div><div class="progress"><i id="bar"></i></div><p class="prompt" id="instruction"></p><div class="question" id="question"></div><div id="audioArea" class="hidden"><button class="btn alt" id="play">🔊 播放發音</button><span class="small">可重複播放</span></div><input id="response" class="answer" placeholder="在這裡輸入答案…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><div class="buttons" id="checkarea"><button id="check" class="btn">檢查答案</button><button id="skip" class="btn outline">不會／看答案</button></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div class="buttons hidden" id="nextarea"><button id="hear" class="btn alt">🔊 聽正確發音</button><button id="next" class="btn">下一題 →</button></div><p class="help">按 Enter 可檢查或進入下一題。日文輸入建議使用手機或電腦的日文鍵盤。</p></section><section id="result" class="panel hidden"><h2>本回合完成！</h2><div class="question" id="finalScore"></div><p id="summary"></p><div id="mistakes"></div><div class="buttons"><button class="btn" id="retry">只練錯題</button><button class="btn alt" id="again">原範圍再考一次</button><button class="btn outline" id="back">返回選擇範圍</button></div></section></main><script>
const D=[];function add(g,rows){rows.forEach((r,i)=>{let [zh,kana,kanji,romaji,note,alts]=r;D.push({g,zh,kana,kanji:kanji||'',romaji:romaji||'',note:note||'',alts:alts||[],idx:i+1})})}
add('第一課｜單語 1–10',[
['我','わたし','私','watashi'],['你、您','あなた','','anata','日文經常省略第二人稱代名詞。'],['他／她／那個人','あのひと','あの人','ano hito','較禮貌的說法：あのかた（あの方）。',['あのかた','あの方','あの ひと','あの かた']],['姓名後的尊稱','さん','','san','要接在人名後面，例如田中さん。',['～さん']],['孩子或親近者的暱稱接尾詞','ちゃん','','chan','接在人名後，例如花ちゃん。',['～ちゃん']],['～人（國籍）','じん','人','jin','例：アメリカじん。',['～じん']],['老師（稱呼別人）','せんせい','先生','sensei','せんせい末尾「せい」是長音感，與教師的使用情境不同。'],['教師（自己的職業）','きょうし','教師','kyōshi','きょう有拗音與長音。'],['學生','がくせい','学生','gakusei'],['公司職員','かいしゃいん','会社員','kaishain','しゃ是拗音。']]);
add('第一課｜單語 11–21',[
['某公司的社員','しゃいん','社員','shain'],['銀行行員','ぎんこういん','銀行員','ginkōin'],['醫生','いしゃ','医者','isha'],['研究人員','けんきゅうしゃ','研究者','kenkyūsha','きゅう與しゃ均須留意。'],['大學','だいがく','大学','daigaku'],['醫院','びょういん','病院','byōin'],['誰、哪位','だれ','誰','dare','敬語：どなた。',['どなた']],['～歲','さい','歳','sai',['～さい']],['幾歲','なんさい','何歳','nansai','敬語：おいくつ。',['おいくつ']],['是、對','はい','','hai'],['不、不是','いいえ','','iie']]);
add('第一課｜練習 C',[
['初次見面','はじめまして','初めまして','hajimemashite'],['我來自～','～からきました','～から来ました','kara kimashita','例：たいわんからきました。',['からきました','から来ました']],['請多多指教','どうぞよろしくおねがいします','どうぞよろしくお願いします','dōzo yoroshiku onegaishimasu'],['不好意思，請問……','しつれいですが','失礼ですが','shitsurei desu ga'],['請問您叫什麼名字？','おなまえは','お名前は','onamae wa','這裡的「は」讀 wa，不是 ha。'],['這位是～先生／小姐','こちらは～さんです','','kochira wa san desu','「は」讀 wa。',['こちらはさんです']]]);
add('第一課｜關連單語 1–10',[
['美國','アメリカ','','amerika'],['英國','イギリス','','igirisu'],['印度','インド','','indo'],['印尼','インドネシア','','indoneshia'],['韓國','かんこく','韓国','kankoku'],['泰國','タイ','','tai'],['中國','ちゅうごく','中国','chūgoku'],['德國','ドイツ','','doitsu'],['日本','にほん','日本','nihon'],['巴西','ブラジル','','burajiru']]);
add('第二課｜單語 1–12',[
['這個（單獨使用）','これ','','kore','これ後面不直接接名詞。'],['那個（靠近聽話者）','それ','','sore'],['那個（離雙方都遠）','あれ','','are'],['這個～（後接名詞）','この','','kono','後面必須接名詞。',['この～']],['那個～（靠近聽話者，後接名詞）','その','','sono',['その～']],['那個～（離雙方都遠，後接名詞）','あの','','ano',['あの～']],['書','ほん','本','hon'],['字典','じしょ','辞書','jisho','しょ為拗音。'],['雜誌','ざっし','雑誌','zasshi','っ為促音，唸時短暫停頓。'],['報紙','しんぶん','新聞','shinbun'],['筆記本','ノート','','nōto','ノー為長音。'],['記事本','てちょう','手帳','techō']]);
add('第二課｜單語 13–24',[
['名片','めいし','名刺','meishi'],['卡片','カード','','kādo'],['鉛筆','えんぴつ','鉛筆','enpitsu'],['原子筆','ボールペン','','bōrupen'],['自動鉛筆','シャープペンシル','','shāpupenshiru'],['鑰匙','かぎ','鍵','kagi'],['鐘錶','とけい','時計','tokei'],['傘','かさ','傘','kasa'],['皮包／提包','かばん','鞄','kaban'],['CD、光碟','シーディー','','shīdī'],['電視','テレビ','','terebi'],['收音機','ラジオ','','rajio']]);
add('第二課｜單語 25–37',[
['照相機','カメラ','','kamera'],['電腦','コンピューター','','konpyūtā'],['汽車','くるま','車','kuruma'],['桌子','つくえ','机','tsukue'],['椅子','いす','椅子','isu'],['巧克力','チョコレート','','chokorēto'],['咖啡','コーヒー','','kōhī'],['伴手禮、土產','おみやげ','お土産','omiyage','也可說「みやげ」。',['みやげ','土産']],['英語','えいご','英語','eigo'],['日語','にほんご','日本語','nihongo'],['～語（語言的接尾詞）','ご','語','go',['～ご']],['什麼','なん','何','nan'],['是的／那樣','そう','','sō']]);
add('第二課｜會話',[
['今後將承蒙您的照顧','これからおせわになります','これからお世話になります','kore kara osewa ni narimasu'],['哪裡哪裡，也請您多多指教','こちらこそどうぞよろしくおねがいします','こちらこそどうぞよろしくお願いします','kochira koso dōzo yoroshiku onegaishimasu']]);
add('第二課｜練習 C',[
['那個……（客氣開口）','あのう','','anō'],['咦？','えっ','','e','小「っ」表示頓挫感。'],['請（勸人做某事）','どうぞ','','dōzo'],['（非常）謝謝您','ありがとうございます','ありがとうございます','arigatō gozaimasu','也可說「どうもありがとうございます」。',['どうもありがとうございます','ありがとう','どうもありがとう']],['這樣啊','そうですか','','sō desu ka'],['不是／不對','ちがいます','違います','chigaimasu'],['啊！（突然想到）','あ','','a']]);
const $=id=>document.getElementById(id), clean=s=>String(s||'').normalize('NFKC').replace(/[\s　。、.!！?？～〜\[\]（）()]/g,'').trim().toLowerCase(), hiragana=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));let pool=[],queue=[],current=null,position=0,correct=0,wrong=[],answered=false,settings={};
function variants(q){return [q.kana,q.kanji,...q.alts].filter(Boolean).map(clean)}
const groups=[...new Set(D.map(x=>x.g))];$('groups').innerHTML=groups.map((g,i)=>`<label class="check"><input type="checkbox" class="group" value="${i}" checked><span>${g} <small style="color:#78879c">(${D.filter(x=>x.g===g).length})</small></span></label>`).join('');
$('all').onclick=()=>document.querySelectorAll('.group').forEach(x=>x.checked=true);$('none').onclick=()=>document.querySelectorAll('.group').forEach(x=>x.checked=false);
function shuffled(a){return [...a].sort(()=>Math.random()-.5)}
function makeQuiz(items){queue=settings.random?shuffled(items):[...items];if(settings.count!=='all')queue=queue.slice(0,Number(settings.count));position=0;correct=0;wrong=[];show('quiz');present()}
function show(s){['setup','quiz','result'].forEach(x=>$(x).classList.toggle('hidden',x!==s));scrollTo({top:0,behavior:'smooth'})}
$('start').onclick=()=>{const chosen=[...document.querySelectorAll('.group:checked')].map(x=>groups[+x.value]);if(!chosen.length){$('error').textContent='請至少選一個範圍。';return}$('error').textContent='';settings={mode:$('mode').value,count:$('count').value,random:$('random').checked};pool=D.filter(x=>chosen.includes(x.g));makeQuiz(pool)};
function qMode(q){if(settings.mode==='mixed'){const modes=['zh','listen'];if(q.kanji)modes.push('kanji');return modes[Math.floor(Math.random()*modes.length)]}return settings.mode==='kanji'&&!q.kanji?'zh':settings.mode}
function present(){if(position>=queue.length){finish();return}current=queue[position];current.mode=qMode(current);answered=false;$('response').value='';$('response').disabled=false;$('feedback').className='feedback hidden';$('nextarea').classList.add('hidden');$('checkarea').classList.remove('hidden');$('step').textContent=`第 ${position+1} / ${queue.length} 題`;$('score').textContent=`正確 ${correct} 題`;$('scope').textContent=current.g;$('bar').style.width=position/queue.length*100+'%';let mode=current.mode;$('audioArea').classList.toggle('hidden',mode!=='listen');$('instruction').textContent=mode==='zh'?'看中文，輸入正確日文（假名或漢字）':mode==='kanji'?'看假名，輸入對應漢字（或中文意思）':'聆聽日文發音，輸入日文（假名或漢字）';$('question').textContent=mode==='zh'?current.zh:mode==='kanji'?current.kana:'🔊 這個日文怎麼寫？';$('response').placeholder=mode==='kanji'?'輸入漢字或中文…':'輸入日文…';$('response').focus();if(mode==='listen')setTimeout(()=>speak(),250)}
function speak(){if(!('speechSynthesis'in window)){alert('此瀏覽器不支援語音播放，請試用 Chrome 或 Safari。');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(current.kana.replace(/～/g,''));u.lang='ja-JP';u.rate=.82;const voices=speechSynthesis.getVoices();const v=voices.find(x=>x.lang.toLowerCase()==='ja-jp')||voices.find(x=>x.lang.startsWith('ja'));if(v)u.voice=v;speechSynthesis.speak(u)}$('play').onclick=speak;$('hear').onclick=speak;
function mark(skip=false){if(answered)return;let q=current,v=clean($('response').value),correctVariants=variants(q);let ok=!skip&&v.length>0&&(correctVariants.includes(v)||correctVariants.includes(clean(hiragana(v)))||(q.mode==='kanji'&&q.zh.split(/[／、，]/).some(x=>clean(x)===v)));answered=true;if(ok)correct++;else wrong.push(q);$('response').disabled=true;$('checkarea').classList.add('hidden');$('nextarea').classList.remove('hidden');const display=q.kanji&&q.kanji!==q.kana?`<span class="jp">${q.kanji}</span> <span class="small">（${q.kana}）</span>`:`<span class="jp">${q.kana}</span>`;$('feedback').className='feedback '+(ok?'good':'bad');$('feedback').innerHTML=`<strong>${ok?'✅ 答對了！':skip?'📚 這題先學起來':'❌ 再記一次'}</strong><div style="margin-top:7px">${display}</div><div>中文：${q.zh}</div><div>羅馬拼音：<b>${q.romaji}</b></div>${q.note?`<div class="note" style="margin-top:9px">💡 ${q.note}</div>`:''}${!ok&&v?`<p class="small">你的作答：${escapeHtml($('response').value)}</p>`:''}`;$('next').focus()}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('check').onclick=()=>mark(false);$('skip').onclick=()=>mark(true);$('next').onclick=()=>{position++;present()};$('response').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();answered?$('next').click():$('check').click()}});
function finish(){show('result');$('finalScore').textContent=`${correct} / ${queue.length} 題正確（${Math.round(correct/queue.length*100)}%）`;$('summary').textContent=wrong.length?`有 ${wrong.length} 題需要複習。可以立即重練錯題，直到全部答對。`:'全部答對！可以提高難度，或改練聽力與漢字。';$('retry').disabled=wrong.length===0;$('mistakes').innerHTML=wrong.length?'<h2>本回合錯題</h2>'+wrong.map(q=>`<span class="chip">${q.zh} → ${q.kanji||q.kana}</span>`).join(''):'';$('bar').style.width='100%'}
$('retry').onclick=()=>{if(!wrong.length)return;const items=[...wrong];settings.count='all';makeQuiz(items)};$('again').onclick=()=>{settings.count=$('count').value;makeQuiz(pool)};$('back').onclick=()=>show('setup');
</script></body></html>
